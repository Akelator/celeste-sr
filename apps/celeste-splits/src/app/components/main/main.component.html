<section class="timer-panel">
  <div class="table-scroll">
    <table aria-label="Tiempos individuales, acumulados y mejores tiempos de segmentos">
      <tbody>
        @for (row of runs.rows(); track $index) {
          <tr [class.active]="segmentActive(row)" [ngClass]="rowColor(row)">
            <th scope="row" class="segment-icon-cell">
              <img
                class="segment-icon"
                [src]="segmentIcons[$index]"
                [alt]="row.name"
                [title]="row.name"
                width="40"
                height="40"
              />
            </th>
            <td class="best-time">
              @if (!!row.runDelta && (row.status === 'active' || row.status === 'completed')) {
                <div class="t-c">
                  <app-time
                    [time]="row.runDelta"
                    [sign]="true"
                    [ngClass]="aheadOrBehind(row.runDelta)"
                  ></app-time>
                  <app-time
                    [time]="row.segmentDelta"
                    [sign]="true"
                    [size]="-15"
                    [ngClass]="aheadOrBehind(row.segmentDelta)"
                  ></app-time>
                </div>
              } @else {
                <div class="t-c">
                  <app-time [time]="row.bestrunTime"></app-time>
                  <app-time [time]="row.bestSegmentTimeMs" [size]="-15"></app-time>
                </div>
              }
            </td>
            <td class="current-time right">
              <div class="t-c">
                <app-time
                  [time]="row.runTime"
                  [ngClass]="aheadOrBehindCompleted(row.runDelta, row.status)"
                ></app-time>
                <app-time
                  [time]="row.timeMs"
                  [ngClass]="aheadOrBehindCompleted(row.segmentDelta, row.status)"
                  [size]="-15"
                ></app-time>
              </div>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
  <div
    class="run-total"
    aria-label="Tiempo acumulado de la run"
    [class.red]="!!bestTotal && !!total && total > bestTotal"
  >
    <app-time class="best-time" [time]="bestTotal"></app-time>
    <app-time [time]="total" [size]="60" (dblclick)="onClear()"></app-time>
  </div>
</section>
