<app-cross-input
  [upPressed]="upPressed"
  [rightPressed]="rightPressed"
  [downPressed]="downPressed"
  [leftPressed]="leftPressed"
></app-cross-input>
<div class="btns">
  <div class="btn blue" [class.pressed]="xPressed">
    <div class="btn-label">X</div>
    <span>DEMO</span>
  </div>
  <div class="btn yellow" [class.pressed]="yPressed">
    <div class="btn-label">Y</div>
    <span>JUMP</span>
  </div>
  <div class="btn green" [class.pressed]="aPressed">
    <div class="btn-label">A</div>
    <span>JUMP</span>
  </div>

  <div class="btn red" [class.pressed]="bPressed">
    <div class="btn-label">B</div>
    <span>DASH</span>
  </div>
</div>
<div class="other-btns">
  <div class="btn pause" [class.pressed]="startPressed">PAUSE</div>
  <div class="btn climb" [class.pressed]="rightStickPressed">CLIMB</div>
</div>
